<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>探索 - gcalc 宇宙版</title>
    <link rel="stylesheet" href="/static/cosmic.css">
</head>
<body class="cosmic-theme">
    <div id="cosmic-bg"></div>
    <div class="container">
        <header class="cosmic-header">
            <h1 class="neon-text">宇宙探索</h1>
            <p class="glow-text">发现命运的星辰轨迹</p>
        </header>
        <section class="explore-grid">
            <div class="cosmic-card" data-type="bazi">
                <h2>八字星图</h2>
                <div class="card-visual"></div>
            </div>
            <div class="cosmic-card" data-type="yijing">
                <h2>周易星盘</h2>
                <div class="card-visual"></div>
            </div>
            <div class="cosmic-card" data-type="qimen">
                <h2>奇门星宫</h2>
                <div class="card-visual"></div>
            </div>
            <div class="cosmic-card" data-type="western">
                <h2>西方星图</h2>
                <div class="card-visual"></div>
            </div>
        </section>
        <a href="/" class="back-link">返回首页</a>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
